# nginx reverse-proxy config for the KB portal (HTTPS edition)
#
# External access:   https://<host>:443  (mapped from container port 443)
# HTTP redirect:     http://<host>:80    → https://<host>:443
#
# Key settings for file uploads:
#   - /ws/upload location with Upgrade headers  → WebSocket upload path
#   - proxy_request_buffering off               → stream chunks to app directly
#   - client_max_body_size 512m                 → large file support
#   - proxy_read_timeout 3600s on WS            → keep connection alive

upstream app {
    server app:5000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    # Убран жестко прописанный порт :443, чтобы избежать битых URL
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS certificate (self-signed, generated by generate-certs.sh)
    ssl_certificate     /etc/nginx/certs/knowledge_ssl.cer;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Modern TLS — TLS 1.2 and 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── WebSocket upload endpoint ─────────────────────────────────────────────
    location /ws/upload {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── File upload API endpoints (HTTP chunked fallback) ────────────────────
    location ~ ^/api/material-versions/[^/]+/(file-chunk|additional-file-chunk|file-data) {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── Static Assets Optimization ────────────────────────────────────────────
    # Буферизация и кеширование тяжелых скомпилированных ассетов (JS, CSS, шрифты)
    location /assets/ {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Оптимизация буферов для быстрой отдачи без обращения к файлу подкачки
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Everything else ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Увеличенные буферы прокси для страниц и обычных запросов
        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 4 128k;
        proxy_busy_buffers_size 128k;

        client_max_body_size 100m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}