# nginx reverse-proxy config for the KB portal
# Place this file at the project root; docker-compose mounts it automatically.
#
# Key settings that make file uploads work correctly:
#   - proxy_http_version 1.1 + Upgrade/Connection headers → WebSocket upload
#   - client_max_body_size 512m           → large files via HTTP fallback
#   - proxy_read_timeout / send_timeout   → long-running chunked uploads
#   - proxy_request_buffering off         → stream chunks directly, no disk buffering

upstream app {
    server app:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;               # replace with your domain if needed

    # ── WebSocket upload endpoint ─────────────────────────────────────────────
    # Without these headers nginx drops the Upgrade handshake and the client
    # falls back to HTTP chunked upload automatically — but keeping WS working
    # avoids the 5-second timeout on first upload.
    location /ws/upload {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep WS connection alive for large files
        proxy_send_timeout 3600s;
    }

    # ── File upload API endpoints (HTTP chunked fallback) ────────────────────
    location ~ ^/api/material-versions/[^/]+/(file-chunk|additional-file-chunk|file-data) {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 512m;      # allow up to 512 MB per request
        proxy_request_buffering off;    # stream to app without buffering to disk
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── Everything else ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 100m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
