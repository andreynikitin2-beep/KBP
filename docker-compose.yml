version: "3.9"

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      FILE_STORAGE_PATH: /data/uploads
      NODE_ENV: production
      PORT: 5000
    volumes:
      # Persistent file storage — survives container restarts/upgrades
      - uploads:/data/uploads
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kb}
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_DB: ${POSTGRES_DB:-kb}
      BACKUP_DIR: /backups
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./backup-db.sh:/backup-db.sh:ro
    depends_on:
      db:
        condition: service_healthy
    # Run at 03:00 every day; keep the container alive with crond
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chmod +x /backup-db.sh
        echo "0 3 * * * /backup-db.sh >> /backups/backup.log 2>&1" | crontab -
        crond -f -l 8

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3710:443"   # HTTPS — main entry point
      - "3709:80"    # HTTP — redirects to https://<host>:3710
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro       # generated by generate-certs.sh
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
