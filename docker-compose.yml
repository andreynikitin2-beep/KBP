version: "3.9"

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      # Ключ шифрования секретов в БД (пароли SMTP/LDAP, API-ключ AI)
      SECRETS_KEY: ${SECRETS_KEY:?Задайте SECRETS_KEY в .env (openssl rand -hex 32)}
      # Проверка сертификата LDAPS: путь к корпоративному CA внутри контейнера
      LDAP_CA_FILE: ${LDAP_CA_FILE:-}
      LDAP_TLS_INSECURE: ${LDAP_TLS_INSECURE:-false}
      # Адрес портала для ссылок в письмах, например https://kb.example.local
      PUBLIC_URL: ${PUBLIC_URL:-}
      FILE_STORAGE_PATH: /data/uploads
      NODE_ENV: production
      PORT: 5000
    volumes:
      # Persistent file storage on the external server
      - ./uploads:/data/uploads
      # Корпоративный CA для LDAPS (положите ca.pem в ./ldap-ca)
      - ./ldap-ca:/app/ldap-ca:ro
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kb}
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_DB: ${POSTGRES_DB:-kb}
      BACKUP_DIR: /backups
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./backup-db.sh:/backup-db.sh:ro
    depends_on:
      db:
        condition: service_healthy
    # Run at 03:00 every day; keep the container alive with crond
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chmod +x /backup-db.sh
        echo "0 3 * * * /backup-db.sh >> /backups/backup.log 2>&1" | crontab -
        crond -f -l 8

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "443:443"   # HTTPS — main entry point
      - "80:80"     # HTTP — redirects to https://<host>:443
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro       # generated by generate-certs.sh
    depends_on:
      - app

volumes:
  pgdata:
